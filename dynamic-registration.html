<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Event Registration</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- ===============================
         HEADER
    ================================ -->

    <header>

        <h1>College Event Portal</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="index.html">Events</a>

            <a href="#">About</a>

            <a href="#">Contact</a>

            <a href="organizer-login.html"
               class="organizer-link">
                Organizer
            </a>

        </nav>

    </header>


    <!-- ===============================
         MAIN CONTENT
    ================================ -->

    <main>

        <!-- EVENT INFORMATION -->

        <section class="event-details">

            <h2 id="eventName">
                Event Registration
            </h2>

            <p class="event-info" id="eventDate"></p>

            <p class="event-info" id="eventTime"></p>

            <p class="event-info" id="eventVenue"></p>

            <p id="eventDescription"></p>

            <p>
                <strong>Registration Fee:</strong>
                <span id="eventFee"></span>
            </p>

        </section>


        <!-- ===============================
             REGISTRATION FORM
        ================================ -->

        <section class="registration">

            <h2>Register for Event</h2>

            <form id="dynamicRegistrationForm">

                <label for="dynamicName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="dynamicName"
                    placeholder="Enter your name"
                    required
                >


                <label for="dynamicBranch">
                    Branch
                </label>

                <select id="dynamicBranch" required>

                    <option value="">
                        Select your branch
                    </option>

                    <option value="CSE">
                        Computer Science
                    </option>

                    <option value="IT">
                        Information Technology
                    </option>

                    <option value="ECE">
                        Electronics & Communication
                    </option>

                    <option value="ME">
                        Mechanical
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="dynamicYear">
                    Year
                </label>

                <select id="dynamicYear" required>

                    <option value="">
                        Select year
                    </option>

                    <option value="1st">
                        1st Year
                    </option>

                    <option value="2nd">
                        2nd Year
                    </option>

                    <option value="3rd">
                        3rd Year
                    </option>

                    <option value="4th">
                        4th Year
                    </option>

                </select>


                <label for="dynamicEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="dynamicEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="dynamicPhone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="dynamicPhone"
                    placeholder="Enter your phone number"
                    required
                >


                <button type="submit">
                    Register Now
                </button>

            </form>


            <!-- SUCCESS MESSAGE -->

            <p id="dynamicSuccessMessage"></p>


            <!-- VIEW PARTICIPANTS -->

            <a id="dynamicViewParticipants"
               href="#"
               style="display: none;">

                <button type="button">
                    View Participants
                </button>

            </a>

        </section>

    </main>


    <!-- ===============================
         FOOTER
    ================================ -->

    <footer>

        <p>© 2026 College Event Portal</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
