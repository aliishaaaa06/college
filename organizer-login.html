
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Organizer Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Header -->

    <header>

        <h1>College Event Portal</h1>

        <nav>

            <a href="index.html">Home</a>

        </nav>

    </header>



    <!-- Organizer Login -->

    <main>

        <section class="registration">

            <h2>Organizer Login</h2>

            <p>Enter the organizer passkey to continue.</p>


            <form id="organizerLoginForm">


                <label for="passkey">
                    Passkey
                </label>

                <input
                    type="password"
                    id="passkey"
                    placeholder="Enter passkey"
                    required
                >


                <button type="submit">
                    Continue
                </button>


            </form>


            <p id="loginMessage"></p>


        </section>

    </main>



    <!-- Footer -->

    <footer>

        <p>© 2026 College Event Portal</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
